<div class="category-management">
  <div class="header">
    <h2>Category Management</h2>
    <button mat-raised-button color="primary" (click)="openCategoryForm()">
      <mat-icon>add</mat-icon>
      Add Category
    </button>
  </div>

  <div class="content">
    <mat-card>
      <mat-card-content>
        <div *ngIf="loading" class="loading">
          <mat-spinner></mat-spinner>
          <p>Loading categories...</p>
        </div>

        <div *ngIf="!loading && categories.length === 0" class="empty-state">
          <mat-icon>category</mat-icon>
          <h3>No categories found</h3>
          <p>Start by adding your first category</p>
          <button mat-raised-button color="primary" (click)="openCategoryForm()">
            Add Category
          </button>
        </div>

        <div *ngIf="!loading && categories.length > 0" class="categories-grid">
          <mat-card *ngFor="let category of categories" class="category-card">
            <mat-card-header>
              <div mat-card-avatar class="category-avatar">
                <mat-icon>category</mat-icon>
              </div>
              <mat-card-title>{{ category.name }}</mat-card-title>
              <mat-card-subtitle>ID: {{ category.id }}</mat-card-subtitle>
            </mat-card-header>
            
            <mat-card-content>
              <div class="category-details">
                <p class="description">{{ category.description || 'No description available' }}</p>
              </div>
            </mat-card-content>
            
            <mat-card-actions>
              <button mat-button color="primary" (click)="openCategoryForm(category)">
                <mat-icon>edit</mat-icon>
                Edit
              </button>
              <button mat-button color="warn" (click)="deleteCategory(category)">
                <mat-icon>delete</mat-icon>
                Delete
              </button>
            </mat-card-actions>
          </mat-card>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
