<div class="product-form">
  <h2 mat-dialog-title>{{ isEditMode ? 'Edit Product' : 'Add New Product' }}</h2>

  <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
    <mat-dialog-content>
      <div class="form-row">
        <label class="custom-label">Product Name</label>
        <input type="text" formControlName="name" placeholder="Enter product name" class="checkout-input">
        <div class="error-message" *ngIf="productForm.get('name')?.hasError('required') && productForm.get('name')?.touched">
          Product name is required
        </div>
        <div class="error-message" *ngIf="productForm.get('name')?.hasError('minlength') && productForm.get('name')?.touched">
          Product name must be at least 3 characters
        </div>
      </div>

      <div class="form-row">
        <label class="custom-label">Slug</label>
        <div class="input-with-button">
          <input type="text" formControlName="slug" placeholder="product-slug" class="checkout-input">
          <button type="button" class="generate-slug-btn" (click)="generateSlug()" matTooltip="Generate slug from name">
            <mat-icon>auto_fix_high</mat-icon>
          </button>
        </div>
        <div class="error-message" *ngIf="productForm.get('slug')?.hasError('required') && productForm.get('slug')?.touched">
          Slug is required
        </div>
        <div class="error-message" *ngIf="productForm.get('slug')?.hasError('pattern') && productForm.get('slug')?.touched">
          Slug must contain only lowercase letters, numbers, and hyphens
        </div>
      </div>

      <div class="form-row">
        <label class="custom-label">Description</label>
        <textarea formControlName="description" rows="3" placeholder="Enter product description" class="checkout-input"></textarea>
      </div>

      <div class="form-row">
        <label class="custom-label">Image URL</label>
        <input type="url" formControlName="image_url" placeholder="https://example.com/image.jpg" class="checkout-input">
      </div>

      <div class="form-row two-columns">
        <div class="form-group">
          <label class="custom-label">Price</label>
          <input type="number" formControlName="price" placeholder="0.00" min="0" step="0.01" class="checkout-input">
          <div class="error-message" *ngIf="productForm.get('price')?.hasError('required') && productForm.get('price')?.touched">
            Price is required
          </div>
          <div class="error-message" *ngIf="productForm.get('price')?.hasError('min') && productForm.get('price')?.touched">
            Price must be positive
          </div>
        </div>

        <div class="form-group">
          <label class="custom-label">Currency</label>
          <select formControlName="currency" class="checkout-input">
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="GBP">GBP</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <label class="custom-label">Category</label>
        <select formControlName="category_id" class="checkout-input">
          <option [value]="null">No Category</option>
          <option *ngFor="let category of categories" [value]="category.id">
            {{ category.name }}
          </option>
        </select>
      </div>

      <div class="form-row">
        <label class="checkbox-label">
          <input type="checkbox" formControlName="is_new" class="checkout-checkbox">
          <span class="checkmark"></span>
          Mark as new product
        </label>
      </div>

      <div class="form-row">
        <label class="custom-label">Features</label>
        <textarea formControlName="features" rows="4" placeholder="Enter product features" class="checkout-input"></textarea>
      </div>

      <div class="form-row">
        <label class="custom-label">Box Contents</label>
        <textarea formControlName="box_details" rows="3" placeholder="Enter box contents" class="checkout-input"></textarea>
      </div>
    </mat-dialog-content>

    <mat-dialog-actions class="centered-actions">
      <button type="button" class="cancel-btn" (click)="onCancel()" [disabled]="loading">
        Cancel
      </button>
      <button type="submit" class="submit-btn" [disabled]="productForm.invalid || loading">
        <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
        <span *ngIf="!loading">{{ isEditMode ? 'Update' : 'Create' }}</span>
      </button>
    </mat-dialog-actions>
  </form>
</div>
