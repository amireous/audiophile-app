<div class="product-management">
  <div class="header">
    <h2>Product Management</h2>
    <button mat-raised-button color="primary" (click)="openProductForm()">
      <mat-icon>add</mat-icon>
      Add Product
    </button>
  </div>

  <div class="content">
    <mat-card>
      <mat-card-content>
        <div *ngIf="loading" class="loading">
          <mat-spinner></mat-spinner>
          <p>Loading products...</p>
        </div>

        <div *ngIf="!loading && products.length === 0" class="empty-state">
          <mat-icon>inventory_2</mat-icon>
          <h3>No products found</h3>
          <p>Start by adding your first product</p>
          <button mat-raised-button color="primary" (click)="openProductForm()">
            Add Product
          </button>
        </div>

        <div *ngIf="!loading && products.length > 0" class="products-grid">
          <mat-card *ngFor="let product of products" class="product-card">
            <mat-card-header>
              <div mat-card-avatar class="product-avatar">
                <img *ngIf="product.image_url" [src]="product.image_url" [alt]="product.name">
                <mat-icon *ngIf="!product.image_url">inventory_2</mat-icon>
              </div>
              <mat-card-title>{{ product.name }}</mat-card-title>
              <mat-card-subtitle>{{ product.slug }}</mat-card-subtitle>
            </mat-card-header>
            
            <mat-card-content>
              <div class="product-details">
                <div class="product-info">
                  <p class="description">{{ product.description | slice:0:100 }}...</p>
                  <div class="price-category">
                    <span class="price">${{ product.price }}</span>
                    <mat-chip *ngIf="product.category" color="primary" selected>
                      {{ getCategoryName(product) }}
                    </mat-chip>
                  </div>
                  <div class="product-meta">
                    <mat-icon *ngIf="product.is_new" color="accent" class="new-badge">new_releases</mat-icon>
                    <span class="product-id">ID: {{ product.id }}</span>
                  </div>
                </div>
              </div>
            </mat-card-content>
            
            <mat-card-actions>
              <button mat-button color="primary" (click)="openProductForm(product)">
                <mat-icon>edit</mat-icon>
                Edit
              </button>
              <button mat-button color="warn" (click)="deleteProduct(product)">
                <mat-icon>delete</mat-icon>
                Delete
              </button>
            </mat-card-actions>
          </mat-card>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
